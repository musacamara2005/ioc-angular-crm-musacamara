<div class="container">
  <h2>Llistat del CRM</h2>

  <!-- Exercici 4: Formulari de cerca -->
  <div class="search-container">
    <input
      type="text" 
      name="cerca"
      [(ngModel)]="textCerca"
      placeholder="Mínim 3 caràcters per cercar..."
      class="search-input"
    />
    <button
      type="button"
      (click)="filtrar()"
      [disabled]="textCerca.length < 3"
      class="search-button"
    >
      Cercar
    </button>
  </div>

  <!-- Exercici 3: Llista amb gestió d'estat i trackBy -->
  <div *ngIf="llista && llista.length > 0; else senseResultats" class="grid">
    <app-targeta-element
      *ngFor="let item of llista; trackBy: trackById"
      [element]="item"
    >
    </app-targeta-element>
  </div>

  <!-- Missatge quan no hi ha resultats -->
  <ng-template #senseResultats>
    <div class="alert" aria-live="polite">
      <p>No s'han trobat elements que coincideixin amb la cerca.</p>
    </div>
  </ng-template>
</div>
